[project]
name = "macrostrat-column-template"
version = "0.1.0"
description = "Build the Macrostrat column ingestion Excel template from its YAML description"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
column-template = "column_template.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["column_template"]
