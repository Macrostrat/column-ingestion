# Macrostrat column ingestion template: human-readable source.
#
# This file defines every tab, header, colour, hover note, dropdown and example row in
# the templates listed under `templates`. Edit this file, then build and review new copies:
#
#   make template   # writes a -new copy of each template; the published files are untouched
#   make promote    # when the new copies look right, replace the published templates with them
#
# Fields, metadata rows, tabs, README blocks, steps, checklist items and example rows can
# carry `only: [<template>, ...]`; they then appear only in those templates.
#
# Field properties:
#   name     - header text, exactly as the ingester reads it (do not rename)
#   kind     - header colour; one of the keys under `kinds`
#   width    - column width (Excel character units; widths under 12 are widened to 12)
#   meaning  - "What it is": shown in the hover note and on the example tab
#   format   - what to type: shown in the hover note and on the example tab
#   validation (optional) - an Excel dropdown or number check, applied to rows 2 onwards
#   link (optional) - a web page for the field's values: in the hover note, and the example
#                     tab's Format cell links to it
#   quickstart (optional) - false if the quickstart guide deliberately leaves this field out

# The published templates; the first is the default. New builds are written beside them
# with a `-new` suffix. All are read by the same ingester; they differ only in which
# fields they offer.
templates:
  - name: expanded
    output: column-ingestion-template-expanded.xlsx
    title: Macrostrat column ingestion template (expanded)
  - name: simple
    output: column-ingestion-template-simple.xlsx
    title: Macrostrat column ingestion template (simple measured column)

# The hand-written guide the templates are read alongside, and the template it walks
# through. `make test` checks that every field of that template is named in the guide's
# section for its tab, unless marked `quickstart: false`.
quickstart:
  guide: ../Docs/Quickstart.md
  template: simple

# Number of rows that dropdowns, number checks and highlights cover.
max_rows: 2000

# Header colours, in the order they appear in the README legend.
kinds:
  required:
    color: "F8B4A6"
    label: Required
    description: The upload fails without it.
  recommended:
    color: "FFE699"
    label: Recommended
    description: Fill in whenever you can.
  either:
    color: "F4B183"
    label: "Required: one of"
    description: Fill at least one field of the pair (strat_name / unit_name on the units tab).
  tie_point:
    color: "BDD7EE"
    label: Age tie point
    description: Fill in only where you know the age (at least 2 per column); ages in between are interpolated.
  optional:
    color: "E7E6E6"
    label: Optional
    description: ""

# Text used on every "(example)" tab.
example_tabs:
  meaning_label: What it is
  format_label: Format
  row_label: Example
  footer: This tab is a guide only and is ignored on upload. Type your own data on the tab without "(example)".

readme:
  name: README
  tab_color: "404040"
  blocks:
    - paragraph: Fill the tabs left to right; the step numbers match the quickstart guide.
    - paragraph: This expanded template offers every field of the format, beyond the simple case the quickstart guide walks through. The full specification describes each one.
      only: [expanded]
    - link: Column ingestion quickstart guide
      url: https://github.com/Macrostrat/column-ingestion/blob/main/Docs/Quickstart.md
    - link: Full specification of the format
      url: https://github.com/Macrostrat/column-ingestion/blob/main/Docs/Full%20specification.md
    - paragraph: Each data tab is followed by an "(example)" tab showing what every field means, its format, and filled-in example rows. Type your own data on the plain tabs (metadata, columns, units, facies, refs). The example tabs are ignored on upload.
    - paragraph: Hover over any header cell (red triangle) for the same explanation. Do NOT rename tabs or headers, and do not add rows above the headers.
    - heading: Header colours
    - legend: [required, recommended, either, tie_point, optional]
    - heading: Steps
    - steps:
        - [1, metadata, "Project name plus a few settings (pre-filled for a measured column; change if needed)."]
        - [2, columns, "One row per column (an outcrop or core site): col_id + lat/lng."]
        - item: [3, units, "One row per unit. A: heights (b_pos = base of the unit in metres above the column base; t_pos only on the topmost unit, or end with an empty closing row holding only b_pos). B: rock (lithology, plus strat_name and/or unit_name). C: ages at tie points (b_int + b_prop)."]
          only: [expanded]
        - item: [3, units, "One row per unit. A: position = height of the unit's base in metres above the column base; end with an empty closing row holding only the height of the top. B: rock (lithology, plus strat_name and/or unit_name). C: ages at tie points (b_int + b_prop)."]
          only: [simple]
        - [4, facies, "Totally optional: named lists of lithologies and environments that units can refer to."]
        - [5, refs, "One row per source: ref_id, authors, title, year."]
        - [6, check, "Work through the checklist below, tab by tab, then upload with \"dry run\" ticked first."]
    - heading: Checklist
    - paragraph: Tick each box as you finish, by picking ☑ from its dropdown.
    - checklist:
        - tab: metadata
          items:
            - project_name (or project_id) is filled in.
            - col_type and axis_type match the data (measured and height for a measured section).
        - tab: columns
          items:
            - Every column has lat + lng, or a POLYGON or LINESTRING in geom (a POINT is rejected).
            - Every column lists its sources in ref_ids.
        - tab: units
          items:
            - Every col_id exists on columns (the dropdown enforces this).
            - item: Every column has a top (t_pos on the top unit, or an empty closing row with only b_pos).
              only: [expanded]
            - item: Every column ends with an empty closing row (only col_id and position).
              only: [simple]
            - Every column has at least 2 age tie points (b_int + b_prop).
            - Every unit has a strat_name or a unit_name (otherwise it is saved as "default").
            - Every interval name is spelled as in Macrostrat (look it up with the link below).
            - Every unit has a lithology, of its own or from its facies.
            - item: Covered intervals are units named covered (or covered = y), and missing rock is a row named gap.
              only: [expanded]
            - item: Covered intervals are units named covered, and missing rock is a row named gap.
              only: [simple]
        - tab: refs
          items:
            - Every ref_id cited on columns is here, with authors, title and a year.
        - tab: images
          items:
            - If you worked from a figure, it is pasted here, and the metadata comments say how heights were measured.
        - tab: upload
          items:
            - Uploaded with "dry run" ticked first, and its warnings read.
    - heading: Look up names
    - link: Macrostrat intervals (for the age tie points)
      url: https://dev.macrostrat.org/lex/intervals
    - link: Macrostrat lithologies (for lithology)
      url: https://dev.macrostrat.org/lex/lithologies
    - heading: Good to know
    - paragraph: Units can be in any order; the ingester sorts them by b_pos. The top of each unit is taken from the base of the unit above. The topmost unit's top is its own t_pos, or an empty closing row above it holding only col_id and b_pos.
      only: [expanded]
    - paragraph: Units can be in any order; the ingester sorts them by position. Each unit runs up to the next row's position, so the column ends with an empty closing row holding only col_id and the height of its top.
      only: [simple]
    - paragraph: A blank b_prop counts as 0 (the oldest end of the interval), so make an educated guess instead.
    - paragraph: Correlated horizons in different columns get the same b_int and b_prop.
    - paragraph: "Covered intervals: add a unit named covered (as its unit_name or lithology), or set covered = y on a unit and give your best inference of its lithology."
      only: [expanded]
    - paragraph: "Covered intervals: add a unit named covered (as its unit_name or lithology)."
      only: [simple]
    - paragraph: "Gaps (missing rock): add a row named gap at the base of the missing interval. No unit is created between it and the next row, and explain the gap in comments."
    - paragraph: Extra tabs (this one, the example tabs and images) are ignored on upload.

sheets:
  # ---------------------------------------------------------------- Step 1
  # Key/value layout: keys down column A, values in column B, no header row.
  - name: metadata
    layout: key_value
    tab_color: "C00000"
    rows:
      - key: project_name
        kind: required
        meaning: Name of the project these columns belong to. Required unless project_id is given.
        format: Text
        example: Southern Marble Mountains - Wood Canyon Formation
      - key: project_id
        kind: optional
        meaning: An existing Macrostrat project ID or short slug, if adding to one.
        format: Whole number or short text
        example: marble_mtns_wood_canyon
      - key: compiler_name
        quickstart: false
        kind: recommended
        meaning: Who built this spreadsheet.
        format: Text
        example: Jane Geologist
      - key: compiler_orcid
        quickstart: false
        kind: optional
        meaning: ORCID of the compiler.
        format: 0000-0000-0000-0000
        example: 0000-0002-1825-0097
      - key: col_type
        default: measured
        choices: [measured, composite]
        kind: recommended
        meaning: '"measured" = a measured section or core at one place; "composite" = a composite column, with units placed in age order.'
        format: measured or composite
        example: measured
      - key: axis_type
        default: height
        choices: [height, age]
        kind: recommended
        meaning: '"height" = unit positions are metres up from the base; "age" = positions number events from the oldest (composite columns).'
        format: height or age
        example: height
      - key: position_unit
        default: meters
        kind: optional
        meaning: Unit used for positions.
        format: meters
        example: meters
      - key: fill_values
        default: "n"
        choices: ["y", "n"]
        kind: required
        meaning: '"y" = a blank lithology/strat_name/etc. cell copies the value from the unit below it, so enter a value at the base of the interval it applies to (type "none" to stop). Do not leave blank.'
        format: y or n
        example: "n"
      - key: comments
        kind: recommended
        meaning: How heights were measured and any general assumptions.
        format: Text
        example: Heights digitized from Fig. 11a with WebPlotDigitizer.
    example:
      tab_color: "F4B6B6"
      columns:
        - [key, 18]
        - [value (example), 45]
        - [What it is, 60]
        - [Format, 24]
      footer: This tab is a guide only and is ignored on upload. On the real metadata tab the keys run down column A and your values go in column B, with no header row.

  # ---------------------------------------------------------------- Step 2
  - name: columns
    tab_color: "ED7D31"
    fields:
      - name: col_id
        kind: required
        width: 10
        meaning: Your own short ID for the column (one outcrop or core site). Units refer to it.
        format: Text, unique, no spaces
      - name: col_name
        kind: recommended
        width: 28
        meaning: Readable name for the column.
        format: Text
      - name: col_group
        kind: recommended
        width: 24
        meaning: Name shared by related columns, to group them.
        format: Text
      - name: lat
        kind: required
        width: 10
        meaning: Latitude of the column. Required unless geom is filled.
        format: Decimal degrees, -90 to 90
        validation: {type: decimal, operator: between, value: -90, max: 90, prompt: "Latitude, -90 to 90"}
      - name: lng
        kind: required
        width: 11
        meaning: Longitude of the column. WEST IS NEGATIVE. Required unless geom is filled.
        format: Decimal degrees, -180 to 180
        validation: {type: decimal, operator: between, value: -180, max: 180, prompt: "Longitude, -180 to 180 (west is negative)"}
      - name: geom
        kind: optional
        width: 28
        meaning: Only if the column covers an area (a POLYGON) or follows a measured traverse (a LINESTRING). A POINT here is rejected; use lat/lng.
        format: POLYGON((lng lat, ...)) or LINESTRING(lng lat, ...)
      - name: ref_ids
        kind: recommended
        width: 16
        meaning: Which source(s) on the refs tab this column comes from.
        format: ref_id, comma-separated
      - name: comments
        kind: optional
        width: 40
        meaning: Where the location came from and how precise it is.
        format: Text
        quickstart: false
    example:
      tab_color: "F8CBAD"
      rows:
        - col_id: MM9
          col_name: Southern Marble Mountains MM9
          col_group: Southern Marble Mountains
          lat: 34.4962
          lng: -115.4859
          ref_ids: Hogan_2011
          comments: Located from Fig. 1 regional map, +/- 2-3 km.
        - col_id: MM1
          col_name: Southern Marble Mountains MM1
          col_group: Southern Marble Mountains
          lat: 34.4898
          lng: -115.4782
          ref_ids: Hogan_2011
          comments: "~1 km SE of MM7-MM9 (Fig. 11c)."

  # ---------------------------------------------------------------- Step 3
  - name: units
    tab_color: "2E75B6"
    fields:
      - name: col_id
        kind: required
        width: 9
        meaning: Which column this unit belongs to.
        format: A col_id from the columns tab
        validation: {type: list, range: "columns!$A$2:$A$500", prompt: Pick a col_id from the columns tab}
      - name: section_id
        only: [expanded]
        kind: optional
        width: 10
        meaning: Leave blank if the column is one continuous section. Use a new ID only where the age model breaks (e.g. a fault).
        format: Text, or blank
      - name: position
        only: [simple]
        kind: required
        width: 10
        meaning: HEIGHT OF THE BASE of this unit, in metres measured up from the base of the column (base = 0). Each unit runs up to the next row's position, so end the column with an empty closing row holding only col_id and the height of its top.
        format: Number (metres)
        validation: {type: decimal, operator: greaterThan, value: -100000, prompt: "Base of the unit, metres above column base"}
      - name: b_pos
        only: [expanded]
        kind: required
        width: 10
        meaning: HEIGHT OF THE BOTTOM of this unit, in metres measured up from the base of the column (base = 0). Every unit needs one.
        format: Number (metres)
        validation: {type: decimal, operator: greaterThan, value: -100000, prompt: "Bottom of the unit, metres above column base"}
      - name: t_pos
        only: [expanded]
        kind: required
        width: 10
        meaning: HEIGHT OF THE TOP of this unit. Fill it ONLY on the topmost unit of each column, or where units overlap; every other top is taken from the b_pos of the unit above. Or leave it blank and end the column with an empty closing row holding only col_id and b_pos.
        format: Number (metres), top unit only
        validation: {type: decimal, operator: greaterThan, value: -100000, prompt: Top of the unit - topmost unit only}
      - name: strat_name
        kind: either
        width: 24
        meaning: "Formation or member name, as named in Macrostrat. Fill strat_name, unit_name, or both: each unit needs at least one. If unit_name is blank, this becomes the unit's name."
        format: Text
      - name: unit_name
        kind: either
        width: 14
        meaning: 'A local name for the unit (e.g. "upper carbonate"). Fill unit_name, strat_name, or both: each unit needs at least one. If both are filled, this is the unit''s name. Write "covered" for a covered interval, or "gap" at the base of missing rock.'
        format: Text
      - name: lithology
        kind: required
        width: 30
        meaning: 'What the rock is: descriptive words, then the rock name. Write "covered" for a covered interval of unknown rock.'
        format: Text; several lithologies separated by ; (names at dev.macrostrat.org/lex/lithologies)
        link: https://dev.macrostrat.org/lex/lithologies
      - name: minor_lith
        only: [expanded]
        kind: optional
        width: 20
        meaning: Lesser lithologies within the unit.
        format: Text, same format as lithology
        link: https://dev.macrostrat.org/lex/lithologies
      - name: covered
        only: [expanded]
        kind: optional
        width: 9
        meaning: '"y" if the unit is covered: present but not exposed. Its lithology is then your best inference (e.g. shale for a recessive interval).'
        format: y, or blank
      - name: basal_surface
        only: [expanded]
        kind: optional
        width: 14
        meaning: Type of contact at the bottom of the unit.
        format: Text, e.g. nonconformity, conformable
      - name: b_int
        kind: tie_point
        width: 16
        meaning: AGE AT THE BOTTOM of this unit, as a geologic time interval. Fill only at tie points (where you know the age); at least 2 per column. Ages in between are interpolated.
        format: Macrostrat interval name (look it up at dev.macrostrat.org/lex/intervals)
        link: https://dev.macrostrat.org/lex/intervals
      - name: b_prop
        kind: tie_point
        width: 9
        meaning: "WHERE IN THAT INTERVAL the bottom falls: 0 = start (oldest) of the interval, 0.5 = middle, 1 = end (youngest). A blank counts as 0, so give a best guess."
        format: Number from 0 to 1
        validation: {type: decimal, operator: between, value: 0, max: 1, prompt: "0 = oldest end, 1 = youngest end"}
      - name: t_int
        only: [expanded]
        kind: tie_point
        width: 13
        meaning: "Age at the top. Usually blank: it is taken from the unit above. Fill only on the top unit if its age is known, or give the empty closing row a b_int instead."
        format: Interval name, or blank (dev.macrostrat.org/lex/intervals)
        link: https://dev.macrostrat.org/lex/intervals
      - name: t_prop
        only: [expanded]
        kind: tie_point
        width: 8
        meaning: Where in t_int the top falls (0-1). Usually blank.
        format: Number 0-1, or blank
        validation: {type: decimal, operator: between, value: 0, max: 1, prompt: "0-1"}
      - name: age_model_notes
        kind: recommended
        width: 36
        meaning: Why you chose each age tie point and proportion.
        format: Text
      - name: facies
        kind: optional
        width: 8
        meaning: "Optional: the facies_id of a facies on the facies tab. Wherever this unit leaves its own lithology or environment blank, it takes the facies'; its own cells always win."
        format: A facies_id, e.g. F1
      - name: comments
        kind: recommended
        width: 40
        meaning: Generalizations, gaps, anything a reader should know.
        format: Text
    # Turn both name cells red when a row has a col_id but neither name.
    highlight_missing:
      fields: [strat_name, unit_name]
      when_filled: col_id
      color: "FF7C80"
    example:
      tab_color: "BDD7EE"
      rows: # column MM9, top to bottom
        - only: [expanded]
          col_id: MM9
          b_pos: 6.16
          t_pos: 7.54
          lithology: cross-stratified sandstone
          strat_name: Wood Canyon Formation
          comments: Top of measured section, so t_pos is filled.
        - only: [expanded]
          col_id: MM9
          b_pos: 5.31
          lithology: pebble, cobble conglomerate
          strat_name: Wood Canyon Formation
          comments: Top comes from the unit above (6.16 m).
        - only: [expanded]
          col_id: MM9
          b_pos: 4.93
          lithology: cross-stratified sandstone
          strat_name: Wood Canyon Formation
        - only: [expanded]
          col_id: MM9
          b_pos: 4.77
          lithology: pebble, cobble conglomerate
          strat_name: Wood Canyon Formation
          b_int: Terreneuvian
          b_prop: 0.75
          age_model_notes: "Placeholder age: base and datum tied within the Terreneuvian; proportions are best guesses."
          comments: "Datum bed: age tie point, same b_int/b_prop in every column."
        - only: [expanded]
          col_id: MM9
          b_pos: 0
          lithology: cross-stratified sandstone
          strat_name: Wood Canyon Formation
          basal_surface: nonconformity
          b_int: Terreneuvian
          b_prop: 0.5
          age_model_notes: "Placeholder age: base and datum tied within the Terreneuvian; proportions are best guesses."
          comments: "Base of column (b_pos = 0): age tie point."
        - only: [simple]
          col_id: MM9
          position: 7.54
          comments: "Empty closing row: the top of the measured section."
        - only: [simple]
          col_id: MM9
          position: 6.16
          lithology: cross-stratified sandstone
          strat_name: Wood Canyon Formation
          comments: Runs up to the closing row (7.54 m).
        - only: [simple]
          col_id: MM9
          position: 5.31
          lithology: pebble, cobble conglomerate
          strat_name: Wood Canyon Formation
        - only: [simple]
          col_id: MM9
          position: 4.93
          unit_name: covered
          strat_name: Wood Canyon Formation
          comments: Covered interval.
        - only: [simple]
          col_id: MM9
          position: 4.77
          lithology: pebble, cobble conglomerate
          strat_name: Wood Canyon Formation
          b_int: Terreneuvian
          b_prop: 0.75
          age_model_notes: "Placeholder age: base and datum tied within the Terreneuvian; proportions are best guesses."
          comments: "Datum bed: age tie point, same b_int/b_prop in every column."
        - only: [simple]
          col_id: MM9
          position: 0
          lithology: cross-stratified sandstone
          strat_name: Wood Canyon Formation
          b_int: Terreneuvian
          b_prop: 0.5
          age_model_notes: "Placeholder age: base and datum tied within the Terreneuvian; proportions are best guesses."
          comments: "Base of column (position = 0): age tie point."

  # ---------------------------------------------------------------- Step 4 (optional)
  - name: facies
    quickstart: false
    tab_color: "A5A5A5"
    fields:
      - name: facies_id
        kind: optional
        width: 10
        meaning: "Totally optional. A short name for the facies, which units can give in their facies field."
        format: Text, unique, e.g. F1
      - name: lithology
        kind: optional
        width: 50
        meaning: The facies' lithologies, written as on the units tab.
        format: Text; several lithologies separated by ; (names at dev.macrostrat.org/lex/lithologies)
        link: https://dev.macrostrat.org/lex/lithologies
      - name: environment
        kind: optional
        width: 24
        meaning: Depositional environment(s) of the facies.
        format: Text; several separated by ; or , (names at dev.macrostrat.org/lex/environments)
        link: https://dev.macrostrat.org/lex/environments
      - name: description
        kind: optional
        width: 45
        meaning: What the facies looks like and how it was recognised.
        format: Text
    example:
      tab_color: "D9D9D9"
      rows:
        - facies_id: F1
          lithology: desiccation cracks, laminated, fine sandstone (10%); lime mudstone
          environment: peritidal
          description: Mud-cracked lime mudstone with thin laminated sandstone beds.
        - facies_id: F2
          lithology: hummocky cross stratification, gutter casts grainstone; lime mudstone (minor); shale (minor)
          environment: offshore ramp
          description: Storm-reworked grainstone between lime mudstone and shale.

  # ---------------------------------------------------------------- Step 5
  - name: refs
    tab_color: "C00000"
    fields:
      - name: ref_id
        kind: required
        width: 16
        meaning: Your own short ID for this source. Columns cite it in ref_ids.
        format: Text, unique, no spaces
      - name: authors
        kind: required
        width: 34
        meaning: All authors of the source.
        format: Text
      - name: title
        kind: required
        width: 44
        meaning: Full title of the source.
        format: Text
      - name: date
        kind: required
        width: 8
        meaning: Year the source was published.
        format: Whole number (year)
        validation: {type: whole, operator: greaterThan, value: 1600, prompt: "Year, e.g. 2011"}
      - name: publication
        kind: recommended
        width: 32
        meaning: Journal, volume and pages.
        format: Text
      - name: doi
        kind: recommended
        width: 18
        meaning: DOI of the source.
        format: Text, without https://doi.org/
      - name: url
        kind: optional
        width: 30
        meaning: Link to the source.
        format: Web address
      - name: comments
        kind: optional
        width: 30
        meaning: Anything else about the source, e.g. which figure you used.
        format: Text
        quickstart: false
    example:
      tab_color: "F4B6B6"
      rows:
        - ref_id: Hogan_2011
          authors: Eric G. Hogan, Christopher M. Fedo, and John D. Cooper
          title: Reassessment of the Basal Sauk Supersequence Boundary across the Laurentian Craton-Margin Hinge Zone, Southeastern California
          date: 2011
          publication: The Journal of Geology, v. 119, no. 6, p. 661-685
          doi: 10.1086/661990
          url: https://doi.org/10.1086/661990
          comments: Column data from Fig. 11a

  - name: images
    quickstart: false
    tab_color: "A5A5A5"
    fields:
      - name: image_name
        kind: optional
        width: 24
        meaning: Paste the image or figure this stratigraphy was captured from onto this tab, and name it here. A separate image file sent with the workbook can be named instead.
        format: Text
      - name: col_ids
        kind: optional
        width: 14
        meaning: The column or columns the image shows.
        format: col_id, comma-separated
      - name: ref_id
        kind: optional
        width: 16
        meaning: The source on the refs tab the image comes from.
        format: A ref_id from the refs tab
      - name: page_no
        kind: optional
        width: 10
        meaning: Page of the source the image is on.
        format: Number
      - name: fig_no
        kind: optional
        width: 10
        meaning: Figure number in the source.
        format: Text, e.g. 11a
      - name: description
        kind: optional
        width: 45
        meaning: Caption, and how heights were read off the image.
        format: Text
